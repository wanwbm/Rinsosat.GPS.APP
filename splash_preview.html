<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rinosat GPS — Splash Premium (demo)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F8FAFC;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  /* ============ 1. GLOW atrás do logo ============ */
  .logo-wrap { position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }

  .glow {
    position: absolute;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,0.35) 0%, rgba(59,130,246,0) 70%);
    opacity: 0;
    transform: scale(0.2);
    animation: glowFade 0.6s ease-out forwards;
  }

  /* ============ 2. LOGO com easeOutBack (settle premium) ============ */
  .logo {
    width: 150px; height: 150px;
    opacity: 0;
    transform: scale(0.5);
    animation:
      logoFade 0.2s ease-in forwards,
      logoScale 0.43s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.12s forwards; /* easeOutBack */
  }

  .logo img { width: 100%; height: 100%; object-fit: contain; }

  /* ============ 3. LINHA DOURADA se desenhando ============ */
  .gold-line-wrap {
    margin-top: 14px;
    width: 120px; height: 2px;
    opacity: 0;
    animation: lineFade 0.18s ease-out 0.72s forwards;
    transform-origin: center;
  }

  .gold-line {
    width: 100%; height: 100%;
    background: linear-gradient(90deg, rgba(201,162,76,0) 0%, #C9A24C 50%, rgba(201,162,76,0) 100%);
    box-shadow: 0 0 8px 1px rgba(201,162,76,0.4);
    transform: scaleX(0);
    animation: lineDraw 0.2s cubic-bezier(0.33, 1, 0.68, 1) 0.75s forwards; /* easeOutCubic */
  }

  /* ============ Keyframes ============ */
  @keyframes glowFade {
    to { opacity: 0.45; transform: scale(1.25); }
  }

  @keyframes logoFade {
    to { opacity: 1; }
  }

  @keyframes logoScale {
    from { transform: scale(0.5); }
    to   { transform: scale(1); }
  }

  @keyframes lineFade {
    to { opacity: 1; }
  }

  @keyframes lineDraw {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="logo-wrap">
      <div class="glow"></div>
      <div class="logo">
        <img src="assets/logo.png" alt="Rinosat GPS">
      </div>
    </div>
    <div class="gold-line-wrap"><div class="gold-line"></div></div>
  </div>
</body>
</html>
